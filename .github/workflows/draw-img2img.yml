name: draw-img2img

# B 线全站照片图生图（Actions 版）。
# 口径（用户 2026-11-10 确认）：源 stations/<slug>/photo.jpg，
# 输出 draw_img/<NN_都道府県>/<slug>.jpg，2400x1800 + OCR 零文字门禁。
# 该账户不支持任何 macOS runner 配置（Vision 无法编译），故用 ubuntu-latest
# + Tesseract(jpn+eng) 作零文字门禁；命中文字按 bbox 补平后复检。
# 提交走 Git Data API（force=false + head 重放），不用 git push，
# 因此 GITHUB_TOKEN 的提交不会触发其它 workflow 的 push 链。
# 单 job 最多 6 小时，全量约 7600 张需分批：本轮跑满 DISPATCH 时限后
# 由 "Chain next batch" 自动 dispatch 下一轮，直到远端 todo 清零。

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: '每批张数'
        required: false
        default: '20'
        type: string
      max_seconds:
        description: '本轮最多跑多少秒（<6h job 上限，留余量给续派）'
        required: false
        default: '19800'
        type: string
      from_end:
        description: 'true=从待办队列尾部取（避开本地长跑正在处理的头部）'
        required: false
        default: 'true'
        type: string
      dry_run:
        description: 'true=只做环境自检（Tesseract/OCR门禁/secrets/远端树/LUPI连通性），不生图不提交'
        required: false
        default: 'false'
        type: string
      chain:
        description: 'true=本轮跑满时限后自动派发下一轮'
        required: false
        default: 'true'
        type: string
      runner:
        description: 'runner label（该账户仅 ubuntu-latest 可用）'
        required: false
        default: 'ubuntu-latest'
        type: string
      chain_depth:
        description: '自动续派代数（内部计数，超过 60 代停止，避免服务异常时无限空转）'
        required: false
        default: '0'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: draw-img2img
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      LUPI_KEY: ${{ secrets.LUPI_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      DRAW_BATCH_SIZE: ${{ inputs.batch_size }}
      DRAW_MAX_SECONDS: ${{ inputs.max_seconds }}
      DRAW_FROM_END: ${{ inputs.from_end }}
      DRAW_DRY_RUN: ${{ inputs.dry_run }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 8584 站照片全量 checkout 体积过大；脚本按 blob sha 拉取源图，
          # 只需拿到 ci/ 下的脚本。
          sparse-checkout: |
            ci
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn tesseract-ocr-eng
          pip install --quiet pillow requests
          tesseract --version | head -n 1
          tesseract --list-langs | tr '\n' ' '; echo

      - name: Self check + draw
        id: draw
        run: |
          set -eo pipefail
          : "${LUPI_KEY:?LUPI_KEY secret 未配置}"
          python3 ci/draw_img2img.py 2>&1 | tee "$RUNNER_TEMP/draw_run.log"

      - name: Chain next batch
        if: success() && inputs.chain == 'true' && inputs.dry_run != 'true' && steps.draw.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          FROM_END: ${{ inputs.from_end }}
          RUNNER_LABEL: ${{ inputs.runner }}
          CHAIN_DEPTH: ${{ inputs.chain_depth }}
        run: |
          set -e
          echo "chain: generated=${{ steps.draw.outputs.generated }} remaining=${{ steps.draw.outputs.remaining }} depth=${CHAIN_DEPTH:-0}"
          depth=$(( ${CHAIN_DEPTH:-0} + 1 ))
          if [ "$depth" -gt 60 ]; then
            echo "chain depth $depth > 60, stop auto-chain to avoid empty spin"
            exit 0
          fi
          export CHAIN_DEPTH="$depth"
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/draw-img2img.yml/dispatches" \
            -d "$(python3 -c '
          import json, os
          print(json.dumps({"ref":"main","inputs":{
            "batch_size":os.environ["BATCH_SIZE"],
            "max_seconds":os.environ["MAX_SECONDS"],
            "from_end":os.environ["FROM_END"],
            "dry_run":"false",
            "chain":"true",
            "runner":os.environ["RUNNER_LABEL"],
            "chain_depth":str(os.environ["CHAIN_DEPTH"])}}))')")
          echo "dispatch HTTP $code"
          cat /tmp/dispatch.out
          [ "$code" = "204" ] || exit 1

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draw-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/draw_gate_*.jpg
            ${{ runner.temp }}/draw_run.log
          if-no-files-found: ignore
