name: batch-fetch

# 云端批处理：抓取 + 许可校验 + 数值质检 + 分块提交，全部在 runner 上完成。
# 单次 push 有实际上限（>2GB 会 HTTP 500），所以图片按 PUSH_CHUNK 站一组提交。
# 每批成功后由本工作流自动 dispatch 下一批，链条不依赖外部轮询。

on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: '批次序号（0 起）'
        required: true
        type: string
      batch_size:
        description: '每批站数'
        required: false
        default: '500'
        type: string
      stations_path:
        description: '目标站清单（仓库内路径，可替换）'
        required: false
        default: 'data/stations_all.json'
        type: string
      retry_only:
        description: '仅跑 dead 站重试（true=跳过本批抓取，且不派发下一批）'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: batch-fetch-chain
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PUSH_CHUNK: '100'
      BATCH_INDEX: ${{ inputs.batch_index }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet pillow numpy requests

      # 加密（2026-11）：抓取脚本入库即密文（encrypted/*.enc + encryption/manifest.tsv），
      # 运行时经 prep.sh 先验后写解密、用毕 clean。钥匙来自 Secret: CODE_KEY。
      # workflow YAML 本身无法加密（GitHub 只从明文 YAML 调度）。
      # inputs 一律 env 中转 + ci/step.sh 内白名单（路径形态/整数），不直插 run:。
      - name: Step 1/3 verify ciphertext (verify-only, zero writes)
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/3 bash encryption/prep.sh 1

      - name: Step 2/3 materialize fetchers
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/3 bash encryption/prep.sh 2

      - name: Step 3/3 Fetch batch
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
          RETRY_ONLY: ${{ inputs.retry_only }}
          STATIONS_PATH: ${{ inputs.stations_path }}
          BATCH_INDEX: ${{ inputs.batch_index }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: bash encryption/logrun.sh 3/3 bash ci/step.sh batch 3

      - name: Verify batch
        id: verify
        # 质检问题不中断链条：失败项写入 data/dead_stations.json（stage=verify），
        # 步骤在 UI 标红但 continue-on-error 让后续 commit/dispatch 照常执行。
        continue-on-error: true
        run: |
          python scripts/verify_local.py --workdir . --dead-list data/dead_stations.json

      # 抓取窗口结束：删除明文脚本（提交只涉及 stations/licenses/索引，不含 scripts/）
      - name: Remove plaintext fetchers
        run: python3 encryption/decrypt.py clean --out .

      - name: Commit & push in chunks (never force)
        env:
          BATCH_INDEX: ${{ inputs.batch_index }}
          STATIONS_PATH: ${{ inputs.stations_path }}
        run: |
          set -e
          git config user.name "jrimages-bot"
          git config user.email "ooep@users.noreply.github.com"

          push_commit () {
            msg="$1"
            if git diff --cached --quiet; then return 0; fi
            git commit -m "$msg"
            for n in 1 2 3 4; do
              if git push origin HEAD:main; then return 0; fi
              echo "push failed ($n), fetch+rebase & retry"
              git fetch origin main
              # dead 重试恢复的站会覆盖已跟踪旧图 → 产生 unstaged changes，
              # 直接 rebase 会被拒（batch 3 曾因此断链）；先 stash 已跟踪改动，rebase 后恢复。
              git stash push -m rebase-shield >/dev/null 2>&1 || true
              if ! git rebase origin/main; then
                git rebase --abort || true
                git stash pop || true
                return 1
              fi
              git stash pop || true
            done
            return 1
          }

          # 先推元数据（状态与进度、dead 清单），失败也能靠 state.json 续跑
          # （set -e 下必须显式兜住，否则元数据推送一失败整个步骤就中止）
          git add index.json state.json PROGRESS.md batch_stats_*.json data/dead_stations.json 2>/dev/null || true
          if ! push_commit "batch ${BATCH_INDEX}: metadata (list=${STATIONS_PATH})"; then
            echo "metadata push failed; continuing (state.json 续跑兜底)"
          fi

          # 图片与许可按 PUSH_CHUNK 站一组提交，避免单次 push 过大
          i=0; g=0
          for d in stations/*/; do
            [ -d "$d" ] || continue
            slug=$(basename "$d")
            git add "stations/$slug" "licenses/$slug.txt" 2>/dev/null || true
            i=$((i+1))
            if [ $((i % PUSH_CHUNK)) -eq 0 ]; then
              g=$((g+1))
              git add index.json state.json PROGRESS.md 2>/dev/null || true
              if ! push_commit "batch ${BATCH_INDEX}: images group $g (${i} stations)"; then
                echo "chunk $g push failed"; exit 1
              fi
            fi
          done
          g=$((g+1))
          git add index.json state.json PROGRESS.md 2>/dev/null || true
          if ! push_commit "batch ${BATCH_INDEX}: images group $g (tail)"; then
            echo "tail push failed"; exit 1
          fi

      - name: Dispatch next batch
        if: success() && inputs.retry_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATIONS_PATH: ${{ inputs.stations_path }}
          BATCH_INDEX: ${{ inputs.batch_index }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          python3 - <<'PY' > /tmp/next.json
          import json, os
          path = os.environ['STATIONS_PATH']
          n = len(json.load(open(path, encoding='utf-8'))['stations'])
          size = int(os.environ['BATCH_SIZE'])
          nxt = int(os.environ['BATCH_INDEX']) + 1
          print(json.dumps({'total': n, 'next': nxt, 'start': nxt * size,
                            'size': size, 'path': path}))
          PY
          TOTAL=$(python3 -c "import json;print(json.load(open('/tmp/next.json'))['total'])")
          NEXT=$(python3 -c "import json;print(json.load(open('/tmp/next.json'))['next'])")
          START=$(python3 -c "import json;print(json.load(open('/tmp/next.json'))['start'])")
          if [ "$START" -ge "$TOTAL" ]; then
            echo "all batches dispatched (total=$TOTAL)"; exit 0
          fi
          echo "dispatching batch $NEXT"
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/batch-fetch.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"batch_index\":\"$NEXT\",\"batch_size\":\"${BATCH_SIZE}\",\"stations_path\":\"${STATIONS_PATH}\"}}")
          echo "dispatch HTTP $code"
          cat /tmp/dispatch.out
          [ "$code" = "204" ] || exit 1

      - name: Upload stats artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ env.BATCH_INDEX }}-stats
          path: |
            batch_stats_*.json
            state.json
          if-no-files-found: ignore

      # 常开收尾：再清一次（幂等）并断言工作区干净（图片/索引为已跟踪或预期产物）。
      # 注意：本流程会提交大量图片，finalize 只断言「无明文脚本残留」语义由 clean 保证；
      # 提交后工作区干净，断言与生产路径一致。
      - name: Finalize (cleanup + worktree assertion)
        if: always()
        run: bash encryption/finalize.sh
