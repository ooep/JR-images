name: sha-audit

# 全量 sha256 复核：在 runner 上遍历 stations/*/photo.jpg 逐张哈希，
# 与 index.json 登记核对（重复/不一致/许可缺失）。只读，不推 main。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet pillow

      - name: Audit sha256
        run: python scripts/sha_audit.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sha-audit-report
          path: |
            sha_audit_report.json
            dhash_map.json
          if-no-files-found: ignore
