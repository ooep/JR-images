name: geo-audit

# 已推图片地理回溯体检：图片页坐标 vs 站点坐标（同名站簇 10km / 其余 20km），
# 无坐标的做都道府县名旁证。只读，不推 main。
#
# 加密（2026-11）：审计脚本含外部地理 API 调用，入库即密文（encrypted/*.enc），
# 运行时经 prep.sh 先验后写解密、用毕 clean。钥匙来自 Secret: CODE_KEY。
# workflow YAML 本身无法加密（GitHub 只从明文 YAML 调度）。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet requests

      - name: Step 1/3 verify ciphertext (verify-only, zero writes)
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/3 bash encryption/prep.sh 1

      - name: Step 2/3 materialize fetchers
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/3 bash encryption/prep.sh 2

      - name: Step 3/3 Geo audit
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 3/3 bash ci/step.sh geo 3

      - name: Remove plaintext fetchers
        run: python3 encryption/decrypt.py clean --out .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-audit-report
          path: geo_audit_report.json
          if-no-files-found: ignore

      - name: Finalize (cleanup + worktree assertion)
        if: always()
        run: bash encryption/finalize.sh
