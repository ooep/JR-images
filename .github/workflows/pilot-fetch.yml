name: pilot-fetch

# 加密（2026-11）：抓取脚本入库即密文（encrypted/*.enc + encryption/manifest.tsv），
# 运行时经 prep.sh 先验后写解密、用毕 clean。钥匙来自 Secret: CODE_KEY。
# workflow YAML 本身无法加密（GitHub 只从明文 YAML 调度）。

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pilot-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Git identity
        run: |
          git config user.name "jr-images-bot"
          git config user.email "jr-images-bot@users.noreply.github.com"

      - name: Step 1/3 verify ciphertext (verify-only, zero writes)
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/3 bash encryption/prep.sh 1

      - name: Step 2/3 materialize fetchers
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/3 bash encryption/prep.sh 2

      - name: Step 3/3 Fetch + encode (resumable)
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 3/3 bash ci/step.sh pilot 3

      # 抓取窗口结束：删除明文脚本（后续校验/提交不涉及 scripts/）
      - name: Remove plaintext fetchers
        run: python3 encryption/decrypt.py clean --out .

      - name: Independent consistency gate
        run: python scripts/validate_manifest.py

      - name: Finalize (cleanup + worktree assertion)
        if: always()
        run: bash encryption/finalize.sh
