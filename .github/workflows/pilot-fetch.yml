name: pilot-fetch

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pilot-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Git identity
        run: |
          git config user.name "jr-images-bot"
          git config user.email "jr-images-bot@users.noreply.github.com"

      - name: Fetch + encode + commit (resumable)
        run: nice -n 19 python scripts/fetch_commons.py

      - name: Independent consistency gate
        run: python scripts/validate_manifest.py
